name: secretum

services:
  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    restart: on-failure

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local development. It runs without S3
  # authentication, so its port is bound to localhost only.
  s3:
    image: chrislusf/seaweedfs:4.51
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
