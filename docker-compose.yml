name: secretum

services:
  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # S3-compatible object storage for local development. It runs without S3
  # authentication, so its port is bound to localhost only.
  s3:
    image: chrislusf/seaweedfs:4.51
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
