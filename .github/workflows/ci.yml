name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: secretum
          POSTGRES_PASSWORD: secretum
          POSTGRES_DB: secretum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretum -d secretum_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRETUM_TEST_DATABASE_URL: postgres://secretum:secretum@localhost:5432/secretum_test?sslmode=disable
      SECRETUM_TEST_S3_ENDPOINT: localhost:9000
      SECRETUM_TEST_S3_ACCESS_KEY: secretum
      SECRETUM_TEST_S3_SECRET_KEY: secretum-secret-key
    steps:
      # Service containers cannot pass arguments to the image, so the
      # S3-compatible storage (SeaweedFS) is started explicitly.
      - name: Start object storage
        run: |
          docker run -d --name s3 -p 9000:8333 chrislusf/seaweedfs:4.51 server -s3 -dir=/data
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ || true)
            case "$code" in 2*|3*|4*) sleep 2; exit 0 ;; esac
            sleep 1
          done
          docker logs s3 >&2
          echo "object storage did not become ready" >&2
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build --build-arg VERSION=${{ github.ref_name }} --build-arg COMMIT=${{ github.sha }} -t secretum:ci .
