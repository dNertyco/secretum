name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: secretum
          POSTGRES_PASSWORD: secretum
          POSTGRES_DB: secretum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretum -d secretum_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRETUM_TEST_DATABASE_URL: postgres://secretum:secretum@localhost:5432/secretum_test?sslmode=disable
      SECRETUM_TEST_S3_ENDPOINT: localhost:9000
      SECRETUM_TEST_S3_ACCESS_KEY: secretum
      SECRETUM_TEST_S3_SECRET_KEY: secretum-secret
    steps:
      # Service containers cannot pass arguments to the image, so MinIO is
      # started explicitly.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=secretum -e MINIO_ROOT_PASSWORD=secretum-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && exit 0
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --build-arg VERSION=${{ github.ref_name }} --build-arg COMMIT=${{ github.sha }} -t secretum:ci .
